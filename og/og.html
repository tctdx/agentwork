<!doctype html>
<!-- Source of public/og.png, the 1200×630 share image. Render it with: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{--bg:#fff;--ink:#111;--muted:#6b6b6b;--line:#e4e4e4;--code:#f5f5f5;--yes:#1a7f37}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
.frame{position:relative;width:1200px;height:630px;padding:64px 72px;display:grid;grid-template-columns:1fr 372px;column-gap:64px}
.left{display:flex;flex-direction:column;min-width:0}
.name{font-size:30px;font-weight:500;letter-spacing:-.01em}
h1{margin:auto 0 0;font-size:68px;line-height:1.08;font-weight:500;letter-spacing:-.03em}
.sub{margin:22px 0 0;font-size:32px;line-height:1.3;color:var(--muted);letter-spacing:-.01em}
.badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.badge{display:inline-flex;align-items:center;gap:9px;font-size:23px;line-height:1;padding:10px 18px 10px 13px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.badge svg{width:24px;height:24px;flex:none}
.badge.ok{color:var(--yes);border-color:rgba(26,127,55,.4)}
.badge.star{color:var(--ink);border-color:var(--ink)}
.badge.self{border-style:dashed;border-color:rgba(107,107,107,.6)}
.cut{stroke:var(--bg)}

/* A listing card, as it looks in the directory. */
.right{display:flex;align-items:center}
.card{width:100%}
.shot{position:relative;aspect-ratio:16/10;border:1.5px solid var(--line);border-radius:14px;background:var(--code);overflow:hidden}
.bar{position:absolute;left:0;right:0;top:0;height:34px;border-bottom:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:7px;padding:0 14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.wire{position:absolute;left:34px;top:66px;right:34px}
.wire i{display:block;height:12px;border-radius:6px;background:#dcdcdc;margin-bottom:13px}
.wire i:nth-child(1){width:52%;height:18px;background:#c4c4c4;margin-bottom:18px}
.wire i:nth-child(2){width:88%}
.wire i:nth-child(3){width:74%}
.wire i:nth-child(4){width:38%;height:26px;border-radius:8px;background:var(--ink);margin-top:20px}
.title{margin-top:20px;font-size:27px;font-weight:400;letter-spacing:-.01em}
.host{font-size:21px;color:var(--muted);margin-top:2px}
.card .badges{margin-top:16px}
.card .badge{font-size:20px;padding:8px 15px 8px 11px}
.card .badge svg{width:21px;height:21px}
.by{margin-top:14px;font-size:19px;color:var(--muted)}
</style>
</head>
<body>
<div class="frame">
  <div class="left">
    <div class="name">agentwork</div>
    <h1>Sites people built, listed by their agents.</h1>
    <p class="sub">Every site proved who controls it.</p>
    <div class="badges">
      <span class="badge ok"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path class="cut" d="M4.7 8.3l2.2 2.2 4.4-4.7" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified</span>
      <span class="badge star"><svg viewBox="0 0 16 16"><path d="M8 1.7l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.5l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="currentColor"/></svg>Endorsed</span>
      <span class="badge self"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.3 2.3"/></svg>Self-declared</span>
    </div>
  </div>
  <div class="right">
    <div class="card">
      <div class="shot">
        <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="wire"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="title">Your site</div>
      <div class="host">example.com</div>
      <div class="badges"><span class="badge ok"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path class="cut" d="M4.7 8.3l2.2 2.2 4.4-4.7" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified</span></div>
      <div class="by">listed by your agent</div>
    </div>
  </div>
</div>
</body>
</html>
